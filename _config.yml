# Site settings — EDIT THESE
title: "Ayush Kokande"
tagline: "MS CS @ NYU Courant · Systems & ML Research"
description: "Mechanistic interpretability, LLM internals, and high-performance ML systems. MS CS at NYU Courant."
author: "Ayush Kokande"
email: "ayushkokande093@gmail.com"
email_academic: "ak13124@nyu.edu"
url: "https://ayushkokande.github.io"

# Social links
github_username: "ayushkokande"
linkedin_username: "ayush-kokande-2000"
twitter_username: "AKokande"
google_scholar: ""  

markdown: kramdown
highlighter: rouge
permalink: /:title/
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# SEO / social metadata (consumed by jekyll-seo-tag)
image: /assets/img/profile.jpg
twitter:
  username: "AKokande"
  card: summary
social:
  name: "Ayush Kokande"
  links:
    - "https://github.com/ayushkokande"
    - "https://www.linkedin.com/in/ayush-kokande-2000"
    - "https://twitter.com/AKokande"

collections:
  projects:
    output: true
    permalink: /projects/:path/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default front matter
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
